defaults:
  - piper_joint_residual
  - _self_

train_datasets:
  piper_right_arm:
    resolver:
      key_map:
        mixed: true
      transform_list:
        mixed: true
  human_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${hydra:runtime.cwd}/.local_calibration/aria_gen2_aligned
      key_map:
        _target_: egomimic.rldb.embodiment.piper_residual_joint.AriaLeftPoseResidualJoint.get_keymap
        action_horizon: 30
      transform_list:
        _target_: egomimic.rldb.embodiment.piper_residual_joint.AriaLeftPoseResidualJoint.get_transform_list
    mode: train
    valid_ratio: 0.1
valid_datasets:
  piper_right_arm:
    resolver:
      key_map:
        mixed: true
        # Merging here detaches the resolver from train's; keep the label tied.
        pose_label: ${data.train_datasets.piper_right_arm.resolver.key_map.pose_label}
      transform_list:
        mixed: true
  human_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver: ${data.train_datasets.human_left_arm.resolver}
    mode: valid
    valid_ratio: 0.1
train_dataloader_params:
  human_left_arm:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    pin_memory: true
valid_dataloader_params:
  human_left_arm:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    pin_memory: true
