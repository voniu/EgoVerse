defaults:
  - hpt_piper_flow
  - _self_

# Shared front encoder, shared visual stem and trunk; separate state stems/heads.
robomimic_model:
  domains: [piper_right_arm, human_left_arm]
  ac_keys:
    human_left_arm: actions_cartesian
  stem_specs:
    human_left_arm:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 6
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    human_left_arm:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: ${action_horizon}
      num_inference_steps: 50
      pooling: null
      time_dist: beta
      infer_ac_dims:
        human_left_arm: 6
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 6
        act_seq: ${action_horizon}
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
