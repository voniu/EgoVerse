defaults:
- hpt_piper_joint_mlp
- _self_

robomimic_model:
  domains: [piper_right_arm, human_left_arm]
  ac_keys:
    human_left_arm: actions_cartesian
  stem_specs:
    human_left_arm:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 6
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    human_left_arm:
      _target_: egomimic.models.mlp_policy.ChunkMLPPolicyHead
      input_dim: 256
      action_horizon: ${action_horizon}
      action_dim: 6
      hidden_dim: 256
