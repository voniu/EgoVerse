defaults:
  - hpt_piper_joint_residual_transformer
  - _self_

robomimic_model:
  _target_: egomimic.algo.hpt_residual_joint.HPTResidualJoint
  6dof: true
  domains: [piper_right_arm, human_left_arm]
  ac_keys:
    piper_right_arm: actions_cartesian_pose
    human_left_arm: actions_cartesian_pose
  shared_ac_key: actions_cartesian_pose
  auxiliary_ac_keys:
    piper_right_arm: [actions_joints]
  loss_weights:
    piper_right_arm: {shared: 1.0, actions_joints: 2.0}
    human_left_arm: {shared: 1.0}
  stem_specs:
    piper_right_arm:
      right_wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn: {crossattn_latent: 16, crossattn_heads: 8, crossattn_dim_head: 64, crossattn_modality_dropout: 0.1, modality_embed_dim: 256}
      state_joints:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 7
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn: {crossattn_latent: 16, crossattn_heads: 8, crossattn_dim_head: 64, crossattn_modality_dropout: 0.1, modality_embed_dim: 256}
    human_left_arm:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 9
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn: {crossattn_latent: 16, crossattn_heads: 8, crossattn_dim_head: 64, crossattn_modality_dropout: 0.1, modality_embed_dim: 256}
  head_specs:
    piper_right_arm: null
    human_left_arm: null
    shared:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 10
      pooling: null
      padding: null
      time_dist: beta
      early_horizon: 30
      early_weight: 2.0
      rotation_geodesic_weight: 0.1
      infer_ac_dims: {piper_right_arm: 9, human_left_arm: 9}
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 9
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
    piper_right_arm_actions_joints:
      _target_: egomimic.models.residual_joint_transformer_keyed.KeyedResidualJointTransformer
      action_horizon: 100
      control_horizon: 30
      joint_dims: 6
      input_dim: 256
      hidden_dim: 256
      num_layers: 3
      num_heads: 4
      dropout: 0.1
      max_residual_deg: 90.0
      joint_error_scale_deg: 5.0
      joint_position_loss_weight: 1.0
      joint_delta_loss_weight: 0.25
      joint_acceleration_loss_weight: 0.10
      joint_jerk_loss_weight: 0.02
      joint_dimension_weights: [1.4, 1.0, 1.0, 1.8, 1.0, 1.2]
      fk_position_loss_weight: 0.10
      fk_position_error_scale_m: 0.02
      fk_rotation_loss_weight: 0.05
      fk_rotation_error_scale_deg: 10.0
      gripper_loss_weight: 1.5
      gripper_closed_weight: 1.76
      gripper_open_weight: 0.70
      gripper_transition_weight: 3.0
      gripper_transition_radius: 2
      gripper_open_prior: 0.716
      infer_ac_dims: {piper_right_arm: 7}
