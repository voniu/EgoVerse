defaults:
- hpt_piper_mlp
- _self_

robomimic_model:
  auxiliary_ac_keys:
    piper_right_arm: [actions_joints]
  stem_specs:
    piper_right_arm:
      state_ee_pose: null
      state_joints:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 7
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
  head_specs:
    piper_right_arm_actions_joints:
      _target_: egomimic.models.mlp_policy.ChunkMLPPolicyHead
      input_dim: 256
      action_horizon: ${action_horizon}
      action_dim: 7
      hidden_dim: 256
