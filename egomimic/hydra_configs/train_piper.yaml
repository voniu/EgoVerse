defaults:
  - data: piper
  - model: hpt_piper_flow
  - _self_

name: piper_a
mode: train
seed: 42
ckpt_path: null
action_horizon: 30
batch_size: 8
num_workers: 4

paths:
  dataset_dir: ${hydra:runtime.cwd}/.local_calibration/piper_all
  output_dir: ${hydra:runtime.output_dir}

hydra:
  run:
    dir: .local_calibration/training/${name}/${now:%Y-%m-%d_%H-%M-%S}

norm_stats:
  norm_mode: quantile
  sample_frac: 1.0
  num_workers: ${num_workers}
  save_cache_dir: ${paths.output_dir}
  precomputed_norm_path: null

trainer:
  _target_: lightning.pytorch.Trainer
  default_root_dir: ${paths.output_dir}
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_steps: 10000
  max_epochs: -1
  limit_train_batches: 100
  limit_val_batches: 10
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 10

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: metrics

callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    monitor: Valid/action_loss
    mode: min
    save_top_k: 1
    save_last: true
    filename: epoch_{epoch}

evaluator:
  _target_: egomimic.eval.eval_hpt_loss.HPTLossEval
