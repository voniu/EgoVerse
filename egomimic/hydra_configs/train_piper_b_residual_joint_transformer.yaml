defaults:
  - train_piper_human
  - override data: piper_human_residual
  - override model: hpt_piper_human_residual_transformer
  - _self_

name: piper_b_residual_joint_transformer
action_horizon: 30
batch_size: 8
trainer:
  max_steps: 30000
  limit_train_batches: 2500
  limit_val_batches: 50
  check_val_every_n_epoch: 1
callbacks:
  checkpoint:
    monitor: Valid/piper_right_arm_loss
    filename: step_{step}
  final_checkpoint:
    _target_: egomimic.pl_utils.save_final.SaveFinalCheckpoint
